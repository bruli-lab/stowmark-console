version: '3'

vars:
  GOLANGCI_LINT_VERSION: 'v2.15.0'
  SANDBOX_DIR: '{{.ROOT_DIR}}/sandbox'

silent: false

tasks:
  default:
    desc: Mostra l'ajuda
    cmds:
      - task --list

  run:
    desc: Arrancar la consola amb el repositori local del sandbox
    interactive: true
    env:
      STOWMARK_REPOSITORY: '{{.SANDBOX_DIR}}/repository'
    cmds:
      - go run ./cmd/console

  build:
    desc: Compilar el binari a bin/
    cmds:
      - go build -o bin/stowmark_console ./cmd/console

  mocks:
    desc: Generar els mocks de les interfícies amb moq
    cmds:
      - |
        set -euo pipefail
        echo "🧩 Generating mocks with moq..."
        go tool moq -rm -out internal/domain/repository/folder_repository_mock_test.go -pkg repository_test ./internal/domain/repository FolderRepository

  fmt:
    desc: Format Go amb gofumpt
    cmds:
      - |
        set -euo pipefail
        echo "👉 Formatting code with gofumpt..."
        go tool gofumpt -w .

  fix:
    desc: fixing code
    cmds:
      - |
        set -euo pipefail
        echo "👉 Running go fix..."
        go fix -v ./...

  security:
    desc: Revisar vulnerabilitats amb govulncheck
    cmds:
      - |
        set -euo pipefail
        echo "👉 Check security"
        go tool govulncheck ./...

  install-lint:
    desc: Instal·lar golangci-lint
    cmds:
      - |
        set -euo pipefail
        echo "🔧 Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  lint:
    desc: Executing golangci-lint
    deps:
      - install-lint
    cmds:
      - |
        set -euo pipefail
        echo "🚀 Executing golangci-lint..."
        golangci-lint run ./...

  test:
    desc: Executing tests amb race, coverage i tparse
    cmds:
      - |
        set -euo pipefail
        echo "🧪 Running unit tests (race, JSON → tparse)..."
        go test -race ./... -json -cover -coverprofile=coverage.out | go tool tparse -all

  check:
    desc: Executing fmt, fix, security, lint i test en ordre
    cmds:
      - task: fmt
      - task: fix
      - task: security
      - task: lint
      - task: test
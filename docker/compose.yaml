name: stowmark-console

services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r2-ls243
    environment:
      PUID: "${HOST_UID:-1000}"
      PGID: "${HOST_GID:-1000}"
      TZ: "Europe/Madrid"
      USER_NAME: "stowmark"
      PUBLIC_KEY_FILE: "/keys/stowmark.pub"
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    volumes:
      - ./.local/ssh/stowmark.pub:/keys/stowmark.pub:ro
      - ssh-repositories:/repositories
    ports:
      - "127.0.0.1:12222:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    image: motoserver/moto:5.2.2
    environment:
      MOTO_SERVICE: s3
    ports:
      - "127.0.0.1:15000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:5000/moto-api/")
      interval: 2s
      timeout: 2s
      retries: 30

  smb:
    image: ghcr.io/servercontainers/samba:smbd-only-a3.24.4-s4.23.8-r0
    environment:
      ACCOUNT_stowmark: stowmark
      UID_stowmark: "${HOST_UID:-1000}"
      AVAHI_DISABLE: "true"
      WSDD2_DISABLE: "true"
      NETBIOS_DISABLE: "true"
      SAMBA_VOLUME_CONFIG_stowmark: |
        [stowmark]
        path = /shares/stowmark
        valid users = stowmark
        read only = no
        browseable = yes
        guest ok = no
        create mask = 0644
        directory mask = 0755
    volumes:
      - smb-share:/shares/stowmark
    ports:
      - "127.0.0.1:11445:445"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 445 || (echo > /dev/tcp/localhost/445)"]
      interval: 2s
      timeout: 2s
      retries: 30

  webdav:
    image: ghcr.io/hacdias/webdav:v5.17.3
    command: ["--config", "/config.yml"]
    volumes:
      - ./webdav/config.yml:/config.yml:ro
      - webdav-data:/data
    ports:
      - "127.0.0.1:18081:8080"

  gcs:
    image: fsouza/fake-gcs-server:1.55.1
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory"]
    ports:
      - "127.0.0.1:14443:4443"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:4443/storage/v1/b"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  ssh-repositories:
  smb-share:
  webdav-data:
